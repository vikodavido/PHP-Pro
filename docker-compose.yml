version: '3.8'

volumes:
  db_data:

networks:
  app-network:
    driver: bridge

services:
  app:
    build: 
      context: .
      dockerfile: ./Dockerfile
    restart: always
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: car_service
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./actions.sql:/docker-entrypoint-initdb.d/actions.sql
    networks:
      - app-network
